<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Mi Tarjeta de Horas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0E6E66">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: app de una columna tipo tarjeta de marcación; cabecera fija arriba, barra de pestañas fija abajo. */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --surface-2:#F6F8FA; --ink:#14202E; --muted:#5B6878; --line:#D5DCE4;
  --accent:#0E6E66; --accent-ink:#FFFFFF; --accent-soft:#DDF0EE;
  --amber:#A8520A; --amber-soft:#FBEBD9; --warn:#B42318; --warn-soft:#FDE6E4;
  --f-display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --r:10px; --tabbar:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E141B; --surface:#17202A; --surface-2:#1C2733; --ink:#E6EDF3; --muted:#93A1B1; --line:#2A3542;
  --accent:#3CC2B4; --accent-ink:#04201D; --accent-soft:#123A37;
  --amber:#F0A44B; --amber-soft:#3A2814; --warn:#F97066; --warn-soft:#3B1A18; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E141B; --surface:#17202A; --surface-2:#1C2733; --ink:#E6EDF3; --muted:#93A1B1; --line:#2A3542;
  --accent:#3CC2B4; --accent-ink:#04201D; --accent-soft:#123A37;
  --amber:#F0A44B; --amber-soft:#3A2814; --warn:#F97066; --warn-soft:#3B1A18; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(var(--tabbar) + 24px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:.01em}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px}
header.top h1{font-size:22px}
header.top .sub{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.iconbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:20px;height:20px}

.banner{font-size:13px;padding:8px 12px;border-radius:8px;background:var(--amber-soft);color:var(--ink);margin-bottom:12px}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.09em}
.muted{color:var(--muted)}
.small{font-size:13px}

/* Tarjeta de marcación */
.punch{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.punch-head{padding:16px 16px 6px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.clock{font-family:var(--f-mono);font-size:52px;font-weight:600;line-height:1;letter-spacing:-.02em;padding:4px 16px 14px}
.slots{display:grid;grid-template-columns:1fr 1fr;border-top:1px dashed var(--line)}
.slot{padding:12px 16px}
.slot+.slot{border-left:1px dashed var(--line)}
.slot .t{font-family:var(--f-mono);font-size:26px;font-weight:600}
.slot .t.empty{color:var(--line)}
.punch-foot{padding:14px 16px 16px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:10px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{padding:15px 16px;font-size:17px;width:100%}
.btn.ghost{background:transparent}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn.danger[data-armed]{background:var(--warn);color:var(--surface)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}

.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-width:0;cursor:pointer;text-align:left;text-decoration:none;color:inherit}
.tile .v{font-family:var(--f-mono);font-size:22px;font-weight:600;margin-top:4px;white-space:nowrap}
.tile .s{font-size:12px;color:var(--muted)}
@media (max-width:380px){.tiles{grid-template-columns:1fr}}

.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.extra{background:var(--accent-soft);color:var(--accent)}
.chip.fer{background:var(--amber-soft);color:var(--amber)}
.chip.late{background:var(--warn-soft);color:var(--warn)}

.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.item{display:flex;gap:12px;align-items:center;padding:12px 14px;cursor:pointer;width:100%;background:none;border:0;text-align:left}
.item+.item{border-top:1px solid var(--line)}
.item .main{flex:1;min-width:0}
.item .t1{font-weight:600}
.item .t2{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.item .right{text-align:right;flex:none;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.datebox{width:44px;flex:none;text-align:center;border:1px solid var(--line);border-radius:8px;padding:4px 0;background:var(--surface-2)}
.datebox b{display:block;font-family:var(--f-mono);font-size:18px;line-height:1.1}
.datebox span{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.empty-state{padding:22px 16px;text-align:center;color:var(--muted)}

.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.monthnav h2{font-size:20px;text-transform:capitalize}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px}
.kv .num{text-align:right}
.kv .tot{font-weight:700;border-top:1px solid var(--line);padding-top:6px}
.formula{font-family:var(--f-mono);font-size:13px;background:var(--surface-2);border:1px dashed var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent)}

/* Formularios */
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:10px 12px;width:100%;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer}
.check input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--accent);flex:none}
.hint{font-size:12px;color:var(--muted)}
.preview{padding:10px 12px;border-radius:8px;background:var(--accent-soft);color:var(--ink);font-size:14px}
.sched{display:flex;flex-direction:column;gap:8px}
.sched-row{display:grid;grid-template-columns:96px 1fr 1fr 70px;gap:6px;align-items:center}
.sched-row input[type=time],.sched-row input[type=number]{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:7px 6px;width:100%;min-width:0;font-family:var(--f-mono);font-size:13px}
.sched-row.off input[type=time],.sched-row.off input[type=number]{opacity:.4}
.sched-head{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

/* Hoja inferior */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(10,16,24,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet h3{font-size:20px;margin-bottom:12px}
.sheet form{display:flex;flex-direction:column;gap:12px}
.sheet .actions{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:4px}
.sheet .actions .btn.primary{flex:1}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:0 max(4px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(4px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tabbar)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);text-decoration:none;font-size:11px;font-weight:600}
nav.tabs a svg{width:22px;height:22px}
nav.tabs a[aria-current="page"]{color:var(--accent)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;margin-bottom:14px}
.seg button{border:0;background:transparent;border-radius:7px;padding:9px 8px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(10,16,24,.12),0 0 0 1px var(--line)}
.big-num{font-size:34px;font-weight:600;line-height:1}
.group-h{display:flex;justify-content:space-between;align-items:baseline;padding:0 2px;font-family:var(--f-display);font-size:17px;font-weight:700}
.group-h .num{font-size:12px;font-weight:500;color:var(--muted)}
.uso-ok{color:var(--accent)}
.usos{display:flex;flex-direction:column;gap:8px}
.usos:empty{display:none}
.uso-row{display:grid;grid-template-columns:1fr 92px 38px;gap:6px;align-items:center}
.uso-row input,.uso-row select{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
.iconbtn.sm{width:38px;height:38px;font-size:20px;line-height:1;color:var(--muted)}
.btn.add-uso{border-style:dashed;color:var(--accent);margin-top:2px}
.det{font-size:14px;padding:10px 12px;border-radius:8px;background:var(--surface-2);border:1px dashed var(--line);color:var(--muted)}
.det.ok{background:var(--amber-soft);border-color:transparent;color:var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabbar) + 16px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;font-weight:600}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>

<div class="wrap">
  <header class="top">
    <div><div class="sub" id="hsub">Control de asistencia</div><h1 id="htitle">Hoy</h1></div>

  <div id="banner"></div>

</div>

</div></nav>

<script>
(function(){
"use strict";
const DIAS=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const COLS=['registros','feriados','devoluciones','vacaciones','gestiones'];
const TIPOS={feriado:'Descanso compensatorio por feriado',extra_tiempo:'Horas extra devueltas en tiempo libre',extra_pago:'Horas extra pagadas'};
const LS_KEY='mi-tarjeta-horas-v1';
function defHorario(){return DIAS.map((_,i)=>({lab:i>=1&&i<=5,ent:'08:00',sal:'17:00',ref:60}));}
const DEFAULT_CONFIG={basico:0,moneda:'Bs',tolerancia:5,vacConteo:'habiles',fechaIngreso:'',salidaDesde:'15:00',umbralSalida:'18:50',extraDesde:'19:00',saldoIniExtraH:0,saldoIniFerDias:0,horario:defHorario()};

const state={config:null,registros:{},feriados:{},devoluciones:{},vacaciones:{},gestiones:{},mode:'loading',stale:false,mes:null};
let db=null;

/* ---------- utilidades ---------- */
const pad=n=>String(n).padStart(2,'0');
const isoDe=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hoyISO=()=>isoDe(new Date());
const ahoraHM=()=>{const d=new Date();return `${pad(d.getHours())}:${pad(d.getMinutes())}`;};
const parseISO=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const dowDe=s=>parseISO(s).getDay();
const toMin=t=>{if(!t)return null;const [h,m]=t.split(':').map(Number);return h*60+m;};
const diffMin=(a,b)=>{let d=toMin(b)-toMin(a);if(d<0)d+=1440;return d;};
const fmtHM=min=>{const s=min<0?'−':'';min=Math.abs(Math.round(min));return `${s}${Math.floor(min/60)}:${pad(min%60)}`;};
const nf=new Intl.NumberFormat('es-BO',{minimumFractionDigits:2,maximumFractionDigits:2});
const nf1=new Intl.NumberFormat('es-BO',{maximumFractionDigits:2});
const money=n=>`${cfg().moneda} ${nf.format(n||0)}`;
const dias=n=>`${nf1.format(n)} ${Math.abs(n)===1?'día':'días'}`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fLarga=s=>parseISO(s).toLocaleDateString('es-BO',{weekday:'long',day:'numeric',month:'long'});
const fMedia=s=>parseISO(s).toLocaleDateString('es-BO',{day:'numeric',month:'short',year:'numeric'});
const diasEntre=(a,b)=>Math.round((parseISO(b)-parseISO(a))/864e5)+1;
const masDiasISO=(s,n)=>{const d=parseISO(s);d.setDate(d.getDate()+n);return isoDe(d);};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const num=v=>{const n=parseFloat(String(v??'').replace(',','.'));return isFinite(n)?n:0;};

function cfg(){
  const c=Object.assign({},DEFAULT_CONFIG,state.config||{});
  const h=Array.isArray(c.horario)&&c.horario.length===7?c.horario:defHorario();
  c.horario=h.map((x,i)=>Object.assign({},defHorario()[i],x));
  return c;
}
const horario=d=>cfg().horario[d];
function jornada(d){const h=horario(d);if(!h.lab)return 0;return Math.max(0,diffMin(h.ent,h.sal)-num(h.ref));}
function trabajado(r){if(!r.entrada||!r.salida)return null;return Math.max(0,diffMin(r.entrada,r.salida)-num(r.ref));}
/* ---------- calendario de feriados: Bolivia + Santa Cruz ---------- */
// DS 2750 (2016): feriados nacionales. Art. 3: si caen domingo, el lunes siguiente es feriado,
// salvo Carnaval, Viernes Santo, Corpus Christi y 2 de noviembre.
function pascua(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),
  h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mes=Math.floor((h+l-7*m+114)/31),dia=((h+l-7*m+114)%31)+1;
  return new Date(y,mes-1,dia);}
const masDias=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
// Cambios por decreto ya publicados (se aplican encima de las reglas generales)
const DECRETOS={
  2026:{fuente:'DS 5521',quitar:['2026-01-22'],agregar:[
    {fecha:'2026-01-23',nombre:'Día del Estado Plurinacional (trasladado del 22)',ambito:'Nacional'},
    {fecha:'2026-06-05',nombre:'Feriado adicional de Corpus Christi',ambito:'Nacional'},
    {fecha:'2026-08-07',nombre:'Feriado adicional por la Independencia',ambito:'Nacional'}],
   renombrar:{'2026-06-22':'Año Nuevo Andino Amazónico Chaqueño (trasladado del domingo)'}}
};
const _cacheFer={};
function generarFeriados(y){
  if(_cacheFer[y])return _cacheFer[y];
  const P=pascua(y), out=[];
  const fijo=(m,d,nombre,ambito,movible)=>{let dt=new Date(y,m-1,d),n=nombre;
    if(movible&&dt.getDay()===0){dt=masDias(dt,1);n+=' (trasladado del domingo)';}
    out.push({fecha:isoDe(dt),nombre:n,ambito,fuente:ambito==='Santa Cruz'?'Departamental':'DS 2750'});};
  const movil=(dt,nombre)=>out.push({fecha:isoDe(dt),nombre,ambito:'Nacional',fuente:'DS 2750'});
  fijo(1,1,'Año Nuevo','Nacional',true);
  fijo(1,22,'Día del Estado Plurinacional','Nacional',true);
  movil(masDias(P,-48),'Carnaval (lunes)');
  movil(masDias(P,-47),'Carnaval (martes)');
  movil(masDias(P,-2),'Viernes Santo');
  fijo(5,1,'Día del Trabajo','Nacional',true);
  movil(masDias(P,60),'Corpus Christi');
  fijo(6,21,'Año Nuevo Andino Amazónico','Nacional',true);
  fijo(8,6,'Día de la Independencia','Nacional',true);
  fijo(9,24,'Aniversario de Santa Cruz','Santa Cruz',true);
  fijo(11,2,'Día de Todos los Difuntos','Nacional',false);
  fijo(12,25,'Navidad','Nacional',true);

// Une el calendario automático con lo que guardaste (trabajado, anulado, agregados por decreto)
function feriadosDelAnio(y){
  y=String(y);const map={};
  generarFeriados(Number(y)).forEach(g=>map[g.fecha]=Object.assign({auto:true},g));
  Object.values(state.feriados).forEach(f=>{if(!f.fecha||!f.fecha.startsWith(y+'-'))return;
    const base=map[f.fecha];
    map[f.fecha]=Object.assign({},base||{ambito:f.ambito||'Nacional'},f,{auto:!!base,nombre:f.nombre||(base&&base.nombre)||'Feriado',fuente:f.fuente||(base&&base.fuente)||''});});
  return Object.values(map).sort((a,b)=>a.fecha.localeCompare(b.fecha));
}
function feriadoEn(fecha){return feriadosDelAnio(fecha.slice(0,4)).find(f=>f.fecha===fecha&&!f.anulado)||null;}
function proximoFeriado(desde){const y=Number(desde.slice(0,4));
  return [...feriadosDelAnio(y),...feriadosDelAnio(y+1)].find(f=>f.fecha>=desde&&!f.anulado)||null;}
function feriadoTrabajado(fecha){const f=state.feriados[fecha];return !!(f&&f.trabajado&&!f.anulado);}
// Horas extra: entrada antes de tu hora de ingreso + salida después del umbral (18:50), contada desde las 19:00.
// En día de descanso todo lo trabajado es extra. Feriado trabajado se compensa con días, no con horas.
function extraDetalle(r){
  const out={man:0,tar:0};
  const h=horario(dowDe(r.fecha)), c=cfg();
  if(!h.lab){out.tar=trabajado(r)||0;return out;}
  if(r.entrada&&toMin(r.entrada)<toMin(h.ent))out.man=toMin(h.ent)-toMin(r.entrada);
  if(r.salida){const s=toMin(r.salida),umbral=Math.max(toMin(c.umbralSalida),toMin(h.sal)),desde=Math.max(toMin(c.extraDesde),toMin(h.sal));
    if(s>umbral)out.tar=Math.max(0,s-desde);}
  return out;
}
const esManual=r=>r.extraManual!==undefined&&r.extraManual!==null&&r.extraManual!=='';
function extra(r){
  if(esManual(r))return num(r.extraManual)*60;
  if(feriadoTrabajado(r.fecha))return 0;
  const d=extraDetalle(r);return d.man+d.tar;
}
function detalleTxt(r){
  if(esManual(r))return 'extra anotada a mano';
  if(feriadoTrabajado(r.fecha))return 'feriado: se compensa con días';
  if(!horario(dowDe(r.fecha)).lab)return 'día de descanso: todo es extra';
  const d=extraDetalle(r);const p=[];if(d.man)p.push(`${fmtHM(d.man)} antes de entrar`);if(d.tar)p.push(`${fmtHM(d.tar)} después de las ${cfg().extraDesde}`);
  return p.join(' + ');
}
/* ---------- vacaciones según la Ley General del Trabajo (Art. 44) ---------- */
// 1 a 5 años: 15 días hábiles · más de 5 hasta 10: 20 · más de 10: 30
const diasPorGestion=n=>n<=5?15:n<=10?20:30;
const masAnios=(d,n)=>new Date(d.getFullYear()+n,d.getMonth(),d.getDate());
function vacGestiones(){
  const fi=cfg().fechaIngreso;if(!fi)return null;
  const ing=parseISO(fi),hoy=parseISO(hoyISO());
  if(ing>hoy)return null;
  const lista=[];let n=1;
  while(masAnios(ing,n)<=hoy&&n<80){
    const ini=isoDe(masAnios(ing,n-1)),fin=isoDe(masDias(masAnios(ing,n),-1));
    const manual=num((state.gestiones['g'+n]||{}).tomados);
    const porPeriodos=Object.values(state.vacaciones).filter(v=>Number(v.gestion)===n).reduce((a,v)=>a+diasVac(v),0);
    const corr=diasPorGestion(n);
    lista.push({n,ini,fin,corr,manual,porPeriodos,tomados:manual+porPeriodos,saldo:corr-manual-porPeriodos,nota:(state.gestiones['g'+n]||{}).nota||''});
    n++;
  }
  const iniAct=masAnios(ing,n-1),finAct=masAnios(ing,n);
  const meses=(hoy.getFullYear()-iniAct.getFullYear())*12+hoy.getMonth()-iniAct.getMonth()-(hoy.getDate()<iniAct.getDate()?1:0);
  const actual={n,ini:isoDe(iniAct),cumple:isoDe(finAct),corr:diasPorGestion(n),meses:Math.max(0,meses),
    pct:Math.min(100,(hoy-iniAct)/(finAct-iniAct)*100),
    tomadosAdelantados:Object.values(state.vacaciones).filter(v=>Number(v.gestion)===n).reduce((a,v)=>a+diasVac(v),0)};
  const disponible=lista.reduce((a,g)=>a+g.saldo,0)-actual.tomadosAdelantados;
  const anios=lista.length,mesesAnt=actual.meses;
  return {lista,actual,disponible,antig:`${anios} ${anios===1?'año':'años'}${mesesAnt?` y ${mesesAnt} ${mesesAnt===1?'mes':'meses'}`:''}`};
}
function tardanza(r){
  const h=horario(dowDe(r.fecha));if(!h.lab||!r.entrada)return 0;
  const t=toMin(r.entrada)-toMin(h.ent);
  return t>num(cfg().tolerancia)?t:0;
}
const compFeriado=f=>(f.trabajado&&!f.anulado)?(f.descanso?2:1):0;
// Fechas en que usaste el descanso de un feriado trabajado: [{fecha:'2026-03-10',dias:1}]
const usosDe=f=>Array.isArray(f&&f.usos)?f.usos.filter(u=>u&&u.fecha).sort((a,b)=>a.fecha.localeCompare(b.fecha)):[];
const usadoFer=f=>compFeriado(f)?usosDe(f).reduce((a,u)=>a+(num(u.dias)||1),0):0;
const pendFer=f=>compFeriado(f)-usadoFer(f);
function usoEn(fecha,excepto){
  for(const f of Object.values(state.feriados)){if(!compFeriado(f)||f.fecha===excepto)continue;
    const u=usosDe(f).find(x=>x.fecha===fecha);if(u)return {fer:f,uso:u};}
  return null;
}
function nombreFer(f){const e=feriadosDelAnio(f.fecha.slice(0,4)).find(x=>x.fecha===f.fecha);return (e&&e.nombre)||f.nombre||'Feriado';}
const fCorta=s=>parseISO(s).toLocaleDateString('es-BO',{day:'numeric',month:'short',year:'numeric'}).replace('.','');
const diaTxt=u=>num(u.dias)===0.5?' (½ día)':'';
function valores(){const b=num(cfg().basico);const h=b/30/8;return {hora:h,extra:h*2};}
function saldos(){
  const c=cfg();
  const regs=Object.values(state.registros);
  const devs=Object.values(state.devoluciones);
  const sum=t=>devs.filter(d=>d.tipo===t).reduce((a,d)=>a+num(d.cantidad),0);
  const extraReg=regs.reduce((a,r)=>a+extra(r),0);
  const extraGen=num(c.saldoIniExtraH)*60+extraReg;
  const extraTiempo=sum('extra_tiempo')*60, extraPago=sum('extra_pago')*60;
  const fers=Object.values(state.feriados);
  const ferReg=fers.reduce((a,f)=>a+compFeriado(f),0);
  const ferUsos=fers.reduce((a,f)=>a+usadoFer(f),0), ferDevs=sum('feriado');
  const ferGen=num(c.saldoIniFerDias)+ferReg, ferComp=ferDevs+ferUsos;
  const vg=vacGestiones();
  return {extraReg,extraGen,extraTiempo,extraPago,extraPend:extraGen-extraTiempo-extraPago,
    ferReg,ferGen,ferUsos,ferDevs,ferComp,ferPend:ferGen-ferComp,vg,vacDisp:vg?vg.disponible:null};
}

function saveLocal(){try{const o={config:state.config};COLS.forEach(c=>o[c]=state[c]);localStorage.setItem(LS_KEY,JSON.stringify(o));}catch(e){}}

async function init(){
  let t0=Date.now();
  while(!(window.claude&&window.claude.use)&&Date.now()-t0<1500){await new Promise(r=>setTimeout(r,100));}
  try{db=window.claude&&window.claude.use?await window.claude.use('db'):null;}catch(e){db=null;}
  if(!db){state.mode='local';loadLocal();render();return;}
  state.mode='db';
  let pending=COLS.length+1;
  const timer=setTimeout(()=>{state.stale=true;render();},10000);
  const done=snap=>{if(!snap.metadata.fromCache&&pending>0){pending--;if(pending===0){clearTimeout(timer);state.stale=false;}}};
  const onErr=e=>{clearTimeout(timer);state.stale=true;render();console.warn(e);};
  db.doc('config/main').onSnapshot(s=>{state.config=s.exists?JSON.parse(JSON.stringify(s.data())):null;done(s);render();},onErr);
  COLS.forEach(col=>db.collection(col).onSnapshot(s=>{const o={};s.docs.forEach(d=>o[d.id]=d.data());state[col]=o;done(s);render();},onErr));
  render();
}

let lastTab=null;
function render(){
  const t=tab();
  document.getElementById('htitle').textContent=TITULOS[t];
  document.querySelectorAll('nav.tabs a').forEach(a=>{if(a.dataset.tab===t)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
  const bn=document.getElementById('banner');
  bn.innerHTML=state.mode==='local'?`<div class="banner">Tus datos se guardan solo en este navegador. Ábrela desde claude.ai con tu cuenta para guardarlos en la nube.</div>`
    :state.mode==='loading'?`<div class="banner">Cargando tus datos…</div>`
    :state.stale?`<div class="banner">No se pudo conectar todavía. Lo que ves puede estar desactualizado.</div>`:'';
  // No redibujar el formulario de ajustes mientras se edita
  if(t==='ajustes'&&lastTab==='ajustes'&&document.getElementById('fAjustes')&&document.activeElement&&document.getElementById('fAjustes').contains(document.activeElement))return;
  const m=document.getElementById('main');
  m.innerHTML={hoy:vHoy,horas:vHoras,feriados:vFeriados,vacaciones:vVacaciones,saldos:vSaldos,ajustes:vAjustes}[t]();
  if(t!==lastTab)window.scrollTo(0,0);
  lastTab=t;
}

/* ---------- hojas (formularios) ---------- */
function toast(msg){const r=document.getElementById('toastRoot');r.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>r.innerHTML='',1800);}
function closeSheet(){document.getElementById('sheetRoot').innerHTML='';}
function openSheet(title,fields,{onSave,onDelete,onInput}={}){
  const root=document.getElementById('sheetRoot');
  root.innerHTML=`<div class="overlay" data-close><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <h3>${esc(title)}</h3><form id="sheetForm" novalidate>${fields}
    <div class="actions">${onDelete?`<button type="button" class="btn danger" data-del>Eliminar</button>`:'<button type="button" class="btn ghost" data-cancel>Cancelar</button>'}<button type="submit" class="btn primary">Guardar</button></div>
    <div class="hint" id="sheetErr" role="alert"></div></form></div></div>`;
  const form=root.querySelector('form');
  const vals=()=>{const o={};new FormData(form).forEach((v,k)=>o[k]=v);form.querySelectorAll('input[type=checkbox]').forEach(c=>o[c.name]=c.checked);return o;};
  if(onInput){form.addEventListener('input',()=>onInput(form,vals()));form.addEventListener('change',e=>onInput(form,vals(),e));onInput(form,vals());}
  root.querySelector('.overlay').addEventListener('click',e=>{if(e.target.hasAttribute('data-close'))closeSheet();});
  const cn=root.querySelector('[data-cancel]');if(cn)cn.onclick=closeSheet;
  const dl=root.querySelector('[data-del]');
  if(dl)dl.onclick=async()=>{if(!dl.hasAttribute('data-armed')){dl.setAttribute('data-armed','');dl.textContent='Toca de nuevo para eliminar';return;}
    try{await onDelete();closeSheet();toast('Eliminado');}catch(e){form.querySelector('#sheetErr').textContent='No se pudo eliminar. Revisa tu conexión e inténtalo otra vez.';}};
  form.addEventListener('submit',async e=>{e.preventDefault();const err=form.querySelector('#sheetErr');
    try{const msg=await onSave(vals());if(typeof msg==='string'&&msg){err.textContent=msg;return;}closeSheet();toast('Guardado');}
    catch(x){console.warn(x);err.textContent='No se pudo guardar. Revisa tu conexión e inténtalo otra vez.';}});
  const first=form.querySelector('input,select');if(first)setTimeout(()=>first.focus({preventScroll:true}),50);
}
const fld=(id,label,input)=>`<div class="field"><label for="${id}">${label}</label>${input}</div>`;

function sheetRegistro(fecha){
  const r=fecha?state.registros[fecha]:null, f=fecha||hoyISO(), h=horario(dowDe(f));

    `<div class="grid2">${fld('r_ref','Refrigerio (min)',`<input type="number" id="r_ref" name="ref" min="0" step="5" value="${r?num(r.ref):(h.lab?num(h.ref):0)}">`)}${fld('r_xm','Horas extra (manual)',`<input id="r_xm" name="extraManual" inputmode="decimal" placeholder="Automático" value="${r&&r.extraManual!=null?esc(r.extraManual):''}">`)}</div>`+
    `<div class="hint">Deja “horas extra” vacío para que se calculen solas: la entrada antes de tu hora de ingreso más la salida después de las ${esc(cfg().umbralSalida)}, contada desde las ${esc(cfg().extraDesde)}.</div>`+
    fld('r_nota','Nota',`<input id="r_nota" name="nota" value="${esc(r?r.nota:'')}" maxlength="140" placeholder="Opcional">`)+
    `<div class="preview" id="r_prev"></div>`,
    {onInput:(form,v)=>{const tmp={fecha:v.fecha,entrada:v.entrada,salida:v.salida,ref:v.ref,extraManual:v.extraManual};const w=trabajado(tmp);const d=v.fecha?dowDe(v.fecha):0;
      if(!v.fecha){form.querySelector('#r_prev').textContent='';return;}
      const x=extra(tmp),dt=detalleTxt(tmp);
      form.querySelector('#r_prev').textContent=(w==null?'':`${fmtHM(w)} h trabajadas · `)+`${fmtHM(x)} h extra`+(dt?` (${dt})`:'');},
     onSave:async v=>{if(!v.fecha)return 'Elige una fecha.';if(!r&&state.registros[v.fecha])return 'Ese día ya tiene marcación. Edítala desde la lista.';
      const x=String(v.extraManual||'').trim();
      await put('registros',v.fecha,{fecha:v.fecha,entrada:v.entrada||'',salida:v.salida||'',ref:num(v.ref),extraManual:x===''?null:num(x),nota:(v.nota||'').trim()});},
     onDelete:r?()=>del('registros',fecha):null});

const usoRow=u=>`<div class="uso-row">
  <input type="date" class="u_f" value="${esc(u?u.fecha:'')}" aria-label="Fecha en que usaste el día">
  <select class="u_d" aria-label="Cantidad"><option value="1" ${!u||num(u.dias)!==0.5?'selected':''}>1 día</option><option value="0.5" ${u&&num(u.dias)===0.5?'selected':''}>½ día</option></select>
  <button type="button" class="iconbtn sm" data-rm-uso aria-label="Quitar esta fecha">×</button></div>`;
const usosEditor=usos=>`<div class="field" id="usosWrap"><label>¿Cuándo usaste el día libre?</label>
  <div class="usos" id="usosList">${usos.map(usoRow).join('')}</div>
  <button type="button" class="btn ghost add-uso" data-add-uso>+ Agregar fecha de uso</button>
  <div class="hint">Anota cada día libre que te dieron a cambio de este feriado. Si aún no lo usaste, déjalo vacío.</div></div>`;
function leerUsos(form){return [...form.querySelectorAll('.uso-row')].map(r=>({fecha:r.querySelector('.u_f').value,dias:num(r.querySelector('.u_d').value)||1})).filter(u=>u.fecha);}
function usosPreview(form,comp){const us=leerUsos(form),u=us.reduce((a,x)=>a+x.dias,0),p=comp-u;
  return `Genera ${dias(comp)}`+(u?` · usaste ${dias(u)}`:'')+(p>0?` · te deben ${dias(p)}.`:p===0?' · ya lo usaste todo.':` · anotaste ${dias(-p)} de más.`);}
function validarUsos(us,comp,fechaFer){
  const vistos=new Set();
  for(const u of us){if(vistos.has(u.fecha))return `Repetiste la fecha ${fCorta(u.fecha)}.`;vistos.add(u.fecha);
    const otro=usoEn(u.fecha,fechaFer);if(otro)return `El ${fCorta(u.fecha)} ya está anotado como descanso de ${nombreFer(otro.fer)} (${fCorta(otro.fer.fecha)}).`;}
  const tot=us.reduce((a,x)=>a+x.dias,0);
  if(tot>comp)return `Este feriado genera ${dias(comp)} y anotaste ${dias(tot)}. Revisa las fechas o marca si cayó en tu descanso.`;
  return '';
}
document.addEventListener('click',e=>{
  const add=e.target.closest('[data-add-uso]'),rm=e.target.closest('[data-rm-uso]');

  else rm.closest('.uso-row').remove();
  form.dispatchEvent(new Event('input',{bubbles:true}));
});

    `<div class="preview" id="fp_prev">Primero elige la fecha del feriado.</div>`,
    {onInput:(form,v,ev)=>{
      const det=form.querySelector('#fp_det'),nw=form.querySelector('#fp_nomWrap'),pv=form.querySelector('#fp_prev');
      if(!v.fecha){det.textContent='Elige la fecha: si es feriado de Bolivia o Santa Cruz, el nombre aparece solo.';nw.hidden=true;pv.textContent='Primero elige la fecha del feriado.';return;}
      const cal=feriadoEn(v.fecha), ya=state.feriados[v.fecha];
      if(ev&&ev.target&&ev.target.name==='fecha'){form.querySelector('#fp_desc').checked=!horario(dowDe(v.fecha)).lab;v.descanso=form.querySelector('#fp_desc').checked;}
      if(cal){det.innerHTML=`<b>${esc(cal.nombre)}</b> · ${DIAS[dowDe(v.fecha)]} · ${esc(cal.ambito||'Nacional')}`;det.className='det ok';nw.hidden=true;}
      else{det.textContent=`${DIAS[dowDe(v.fecha)]}: no está en el calendario oficial. Escribe el motivo (por ejemplo, un feriado por decreto).`;det.className='det';nw.hidden=false;}
      if(ya&&compFeriado(ya)){pv.textContent='Este feriado ya está registrado. Ciérralo y tócalo en la lista para editarlo.';return;}
      pv.textContent=usosPreview(form,v.descanso?2:1);},
     onSave:async v=>{
      if(!v.fecha)return 'Elige la fecha del feriado.';
      if(v.fecha>hoy)return 'Para feriados que vienen, márcalos en el Calendario cuando los trabajes.';
      const ya=state.feriados[v.fecha];
      if(ya&&compFeriado(ya))return 'Ese feriado ya está registrado. Tócalo en la lista para editarlo.';
      const form=document.getElementById('sheetForm'),us=leerUsos(form),comp=v.descanso?2:1;
      const err=validarUsos(us,comp,v.fecha);if(err)return err;
      const cal=feriadoEn(v.fecha),auto=cal&&cal.auto;
      if(auto){await put('feriados',v.fecha,{fecha:v.fecha,trabajado:true,descanso:!!v.descanso,anulado:false,usos:us});return;}
      if(!cal&&!(v.nombre||'').trim())return 'Escribe el motivo del feriado.';
      await put('feriados',v.fecha,Object.assign({fuente:'',ambito:'Nacional',origen:'manual'},ya||{},{fecha:v.fecha,nombre:(cal?cal.nombre:v.nombre).trim(),trabajado:true,descanso:!!v.descanso,anulado:false,usos:us}));}});
}
function sheetFeriado(fecha){
  const stored=fecha?state.feriados[fecha]:null;
  const e=fecha?feriadosDelAnio(fecha.slice(0,4)).find(x=>x.fecha===fecha):null;
  if(e&&e.auto){
    // Feriado del calendario oficial: solo se marca si lo trabajaste o si no se aplicó
    const dt=parseISO(fecha), lab=horario(dt.getDay()).lab;
    openSheet(e.nombre,
      `<div class="small muted" style="text-transform:capitalize">${esc(fLarga(fecha))} · ${esc(e.ambito)}${e.fuente?' · '+esc(e.fuente):''}</div>`+
      `<label class="check"><input type="checkbox" id="f_trab" name="trabajado" ${stored&&stored.trabajado?'checked':''}><span>Trabajé este feriado</span></label>`+
      `<label class="check"><input type="checkbox" id="f_desc" name="descanso" ${stored?(stored.descanso?'checked':''):(lab?'':'checked')}><span>Cayó en mi día de descanso<br><span class="hint">Se marca solo según tu horario; cámbialo si ese día tenías otro turno.</span></span></label>`+
      `<label class="check"><input type="checkbox" id="f_anul" name="anulado" ${stored&&stored.anulado?'checked':''}><span>Este feriado no se aplicó<br><span class="hint">Úsalo si un decreto lo trasladó a otra fecha; luego agrega la nueva fecha con “Agregar feriado por decreto”.</span></span></label>`+
      usosEditor(usosDe(stored))+
      `<div class="preview" id="f_prev"></div>`,
      {onInput:(form,v)=>{const on=v.trabajado&&!v.anulado;form.querySelector('#usosWrap').hidden=!on;
         form.querySelector('#f_prev').textContent=v.anulado?'No cuenta como feriado.':on?usosPreview(form,compFeriado(v)):'No suma días: no lo trabajaste.';},
       onSave:async v=>{const doc={fecha,trabajado:!!v.trabajado,descanso:!!v.descanso,anulado:!!v.anulado};
         if(!doc.trabajado&&!doc.anulado){if(stored)await del('feriados',fecha);return;}
         if(doc.trabajado&&!doc.anulado){const us=leerUsos(document.getElementById('sheetForm'));const err=validarUsos(us,compFeriado(doc),fecha);if(err)return err;doc.usos=us;}
         await put('feriados',fecha,doc);}});
    return;
  }
  // Feriado agregado por decreto (o anotado a mano)
  const f=stored;
  openSheet(f?'Editar feriado':'Agregar feriado por decreto',
    fld('f_fecha','Fecha del feriado',`<input type="date" id="f_fecha" name="fecha" value="${f?f.fecha:hoyISO()}" ${f?'readonly':''}>`)+
    fld('f_nom','Motivo',`<input id="f_nom" name="nombre" value="${esc(f?f.nombre:'')}" maxlength="80" placeholder="Ej. Feriado adicional por Carnaval">`)+
    `<div class="grid2">${fld('f_fuente','Decreto o resolución',`<input id="f_fuente" name="fuente" value="${esc(f?f.fuente:'')}" maxlength="60" placeholder="Ej. DS 5600">`)}${fld('f_amb','Alcance',`<select id="f_amb" name="ambito"><option ${!f||f.ambito!=='Santa Cruz'?'selected':''}>Nacional</option><option ${f&&f.ambito==='Santa Cruz'?'selected':''}>Santa Cruz</option></select>`)}</div>`+
    `<label class="check"><input type="checkbox" id="f_trab" name="trabajado" ${f&&f.trabajado?'checked':''}><span>Trabajé este feriado</span></label>`+
    `<label class="check"><input type="checkbox" id="f_desc" name="descanso" ${f&&f.descanso?'checked':''}><span>Cayó en mi día de descanso<br><span class="hint">Se marca solo según tu horario; cámbialo si ese día tenías otro turno.</span></span></label>`+
    usosEditor(usosDe(f))+
    `<div class="preview" id="f_prev"></div>`,
    {onInput:(form,v,ev)=>{if(!f&&(!ev||(ev.target&&ev.target.name==='fecha'))&&v.fecha){form.querySelector('#f_desc').checked=!horario(dowDe(v.fecha)).lab;v.descanso=form.querySelector('#f_desc').checked;}
      form.querySelector('#usosWrap').hidden=!v.trabajado;
      form.querySelector('#f_prev').textContent=v.fecha?`${DIAS[dowDe(v.fecha)]}: ${v.trabajado?usosPreview(form,compFeriado(v)):'si lo trabajas, márcalo para sumar días.'}`:'';},
     onSave:async v=>{if(!v.fecha)return 'Elige una fecha.';
      if(!f){const ya=feriadosDelAnio(v.fecha.slice(0,4)).find(x=>x.fecha===v.fecha&&!x.anulado);if(ya)return `Ese día ya es feriado (${ya.nombre}). Tócalo en la lista para marcarlo.`;}
      if(!(v.nombre||'').trim())return 'Escribe el motivo del feriado.';
      const us=v.trabajado?leerUsos(document.getElementById('sheetForm')):[];
      if(v.trabajado){const err=validarUsos(us,v.descanso?2:1,v.fecha);if(err)return err;}
      await put('feriados',v.fecha,{fecha:v.fecha,nombre:v.nombre.trim(),fuente:(v.fuente||'').trim(),ambito:v.ambito||'Nacional',origen:(f&&f.origen)||'decreto',trabajado:!!v.trabajado,descanso:!!v.descanso,usos:us});},
     onDelete:f?()=>del('feriados',fecha):null});
}
function diasVac(v){
  if(!v.inicio||!v.fin||v.fin<v.inicio)return 0;
  if(cfg().vacConteo==='calendario')return diasEntre(v.inicio,v.fin);
  let n=0;for(let d=parseISO(v.inicio),fin=parseISO(v.fin);d<=fin;d.setDate(d.getDate()+1)){if(horario(d.getDay()).lab&&!feriadoEn(isoDe(d)))n++;}
  return n;
}
const conteoTxt=()=>cfg().vacConteo==='calendario'?'calendario':'hábiles';
function sheetVacacion(id){
  const vv=id?state.vacaciones[id]:null, h=hoyISO(), vg=vacGestiones();
  const opts=vg?[...vg.lista.map(g=>({n:g.n,t:`Gestión ${g.n} (quedan ${nf1.format(g.saldo)})`,s:g.saldo})),{n:vg.actual.n,t:`Gestión ${vg.actual.n} en curso (adelanto)`,s:0}]:[];
  const def=vv&&vv.gestion?Number(vv.gestion):((opts.find(o=>o.s>0)||opts[opts.length-1]||{}).n);
  openSheet(vv?'Editar vacaciones':'Registrar vacaciones',
    `<div class="grid2">${fld('v_ini','Desde',`<input type="date" id="v_ini" name="inicio" value="${vv?vv.inicio:h}">`)}${fld('v_fin','Hasta',`<input type="date" id="v_fin" name="fin" value="${vv?vv.fin:h}">`)}</div>`+
    (opts.length?fld('v_ges','Descontar de',`<select id="v_ges" name="gestion">${opts.map(o=>`<option value="${o.n}" ${o.n===def?'selected':''}>${o.t}</option>`).join('')}</select>`):'')+
    fld('v_nota','Nota',`<input id="v_nota" name="nota" value="${esc(vv?vv.nota:'')}" maxlength="140" placeholder="Opcional">`)+`<div class="preview" id="v_prev"></div>`,
    {onInput:(form,v)=>{form.querySelector('#v_prev').textContent=v.inicio&&v.fin&&v.fin>=v.inicio?`${dias(diasVac(v))} ${conteoTxt()} (${diasEntre(v.inicio,v.fin)} calendario)`:'La fecha final debe ser igual o posterior a la inicial.';},
     onSave:async v=>{if(!v.inicio||!v.fin||v.fin<v.inicio)return 'Revisa las fechas.';await put('vacaciones',id||uid(),{inicio:v.inicio,fin:v.fin,gestion:v.gestion?Number(v.gestion):null,nota:(v.nota||'').trim()});},
     onDelete:vv?()=>del('vacaciones',id):null});
}
function sheetGestion(n){
  const vg=vacGestiones();const g=vg&&vg.lista.find(x=>x.n===n);if(!g)return;
  openSheet(`Gestión ${n}`,
    `<div class="small muted">${fMedia(g.ini)} – ${fMedia(g.fin)} · te corresponden <b>${g.corr} días ${conteoTxt()}</b></div>`+
    fld('g_tom','Días que ya tomaste de esta gestión',`<input id="g_tom" name="tomados" inputmode="decimal" value="${g.manual||''}" placeholder="0">`)+
    (g.porPeriodos?`<div class="hint">Además hay ${dias(g.porPeriodos)} en períodos registrados con fechas; esos se suman solos.</div>`:'')+
    fld('g_nota','Nota',`<input id="g_nota" name="nota" value="${esc(g.nota)}" maxlength="140" placeholder="Ej. 10 días en diciembre, 5 en abril">`)+
    `<div class="preview" id="g_prev"></div>`,
    {onInput:(form,v)=>{const s=g.corr-num(v.tomados)-g.porPeriodos;form.querySelector('#g_prev').textContent=s>=0?`Te quedan ${dias(s)} de esta gestión.`:`Tomaste ${dias(-s)} más de lo que corresponde.`;},
     onSave:async v=>{const t=num(v.tomados);if(t<0)return 'La cantidad no puede ser negativa.';
       if(!t&&!(v.nota||'').trim()){if(state.gestiones['g'+n])await del('gestiones','g'+n);return;}
       await put('gestiones','g'+n,{gestion:n,tomados:t,nota:(v.nota||'').trim()});}});
}
function sheetFechaIngreso(){
  openSheet('Fecha de ingreso',
    fld('fi_f','¿Cuándo empezaste a trabajar?',`<input type="date" id="fi_f" name="fecha" value="${esc(cfg().fechaIngreso||'')}" max="${hoyISO()}">`)+
    `<div class="hint">Con esta fecha se calculan tus gestiones y los días de vacación según la Ley General del Trabajo.</div>`,
    {onSave:async v=>{if(!v.fecha||v.fecha>hoyISO())return 'Elige una fecha válida.';await putConfig(Object.assign({},state.config||{},{fechaIngreso:v.fecha}));}});
}
function sheetDevolucion(id){
  const d=id?state.devoluciones[id]:null;
  openSheet(d?'Editar movimiento':'Registrar devolución o pago',
    fld('d_tipo','Tipo',`<select id="d_tipo" name="tipo">${Object.entries(TIPOS).map(([k,t])=>`<option value="${k}" ${d&&d.tipo===k?'selected':''}>${t}</option>`).join('')}</select>`)+
    `<div class="grid2">${fld('d_fecha','Fecha',`<input type="date" id="d_fecha" name="fecha" value="${d?d.fecha:hoyISO()}">`)}${fld('d_cant','<span id="d_unit">Cantidad</span>',`<input id="d_cant" name="cantidad" inputmode="decimal" value="${d?esc(d.cantidad):''}" placeholder="0">`)}</div>`+
    fld('d_nota','Nota',`<input id="d_nota" name="nota" value="${esc(d?d.nota:'')}" maxlength="140" placeholder="Opcional">`)+`<div class="preview" id="d_prev"></div>`,
    {onInput:(form,v)=>{const isH=v.tipo!=='feriado';form.querySelector('#d_unit').textContent=isH?'Horas':'Días';const q=num(v.cantidad),s=saldos();
      form.querySelector('#d_prev').textContent=isH?`${fmtHM(q*60)} h`+(v.tipo==='extra_pago'&&num(cfg().basico)?` = ${money(q*valores().extra)}`:'')+` · pendientes ahora: ${fmtHM(s.extraPend)} h`:`${dias(q)} · te deben ahora: ${dias(s.ferPend)}`;},
     onSave:async v=>{if(!(num(v.cantidad)>0))return 'Ingresa una cantidad mayor que cero.';await put('devoluciones',id||uid(),{tipo:v.tipo,fecha:v.fecha||hoyISO(),cantidad:num(v.cantidad),nota:(v.nota||'').trim()});},
     onDelete:d?()=>del('devoluciones',id):null});
}

/* ---------- acciones ---------- */
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act, id=b.dataset.id;
  try{
    if(a==='marcar-entrada'){const f=hoyISO(),h=horario(dowDe(f));b.disabled=true;await put('registros',f,{fecha:f,entrada:ahoraHM(),salida:'',ref:h.lab?num(h.ref):0,extraManual:null,nota:''});
      const fer=feriadoEn(f);
      if(fer&&!fer.trabajado){await put('feriados',f,Object.assign({},state.feriados[f]||{fecha:f},{trabajado:true,descanso:!h.lab}));toast(`Entrada marcada · feriado: +${dias(h.lab?1:2)}`);}
      else toast('Entrada marcada');}
    else if(a==='anio-fer'){state.anioFer+=Number(b.dataset.d);render();}
    else if(a==='fer-vista'){state.ferVista=b.dataset.v;render();}
    else if(a==='feriado-pasado')sheetFeriadoPasado();
    else if(a==='marcar-salida'){const f=hoyISO(),h=horario(dowDe(f));b.disabled=true;
      const base=state.registros[f]||{fecha:f,entrada:'',ref:h.lab?num(h.ref):0,extraManual:null,nota:''};
      const r=Object.assign({},base,{salida:ahoraHM()});await put('registros',f,r);
      const x=r.entrada?extra(r):0;toast(x?`Salida marcada · ${fmtHM(x)} h extra`:'Salida marcada');}
    else if(a==='editar-gestion')sheetGestion(Number(id));
    else if(a==='fecha-ingreso'){e.preventDefault();sheetFechaIngreso();}
    else if(a==='editar-registro')sheetRegistro(id);
    else if(a==='nuevo-registro')sheetRegistro(null);
    else if(a==='mes'){const [y,m]=state.mes.split('-').map(Number);const d=new Date(y,m-1+Number(b.dataset.d),1);state.mes=isoDe(d).slice(0,7);render();}
    else if(a==='nuevo-feriado')sheetFeriado(null);
    else if(a==='editar-feriado')sheetFeriado(id);
    else if(a==='nueva-vacacion')sheetVacacion(null);
    else if(a==='editar-vacacion')sheetVacacion(id);
    else if(a==='nueva-devolucion')sheetDevolucion(null);
    else if(a==='editar-devolucion')sheetDevolucion(id);
  }catch(x){console.warn(x);b.disabled=false;toast('No se pudo guardar');}
});
document.addEventListener('change',e=>{const cb=e.target;if(cb.matches&&cb.matches('#fAjustes input[type=checkbox]')){cb.closest('.sched-row').classList.toggle('off',!cb.checked);}});
document.addEventListener('input',e=>{if(e.target.id==='a_basico'||e.target.id==='a_moneda'){const b=num(document.getElementById('a_basico').value),mo=document.getElementById('a_moneda').value||'S/';const h=b/30/8;
  document.getElementById('a_formula').innerHTML=b?`${esc(mo)} ${nf.format(b)} ÷ 30 ÷ 8 × 2 = <b>${esc(mo)} ${nf.format(h*2)}</b> por hora extra`:'Hora extra = haber básico ÷ 30 ÷ 8 × 2';}});
document.addEventListener('submit',async e=>{
  if(e.target.id!=='fAjustes')return;e.preventDefault();
  const f=e.target, g=n=>f.elements[n];
  const c={basico:num(g('basico').value),moneda:(g('moneda').value||'Bs').trim(),tolerancia:num(g('tolerancia').value),vacConteo:g('vacConteo').value,fechaIngreso:g('fechaIngreso').value||'',salidaDesde:g('salidaDesde').value||'15:00',umbralSalida:g('umbralSalida').value||'18:50',extraDesde:g('extraDesde').value||'19:00',
    saldoIniExtraH:num(g('saldoIniExtraH').value),saldoIniFerDias:num(g('saldoIniFerDias').value),
    horario:DIAS.map((_,i)=>({lab:g(`h${i}_lab`).checked,ent:g(`h${i}_ent`).value||'08:00',sal:g(`h${i}_sal`).value||'17:00',ref:num(g(`h${i}_ref`).value)}))};
  try{document.activeElement&&document.activeElement.blur();await putConfig(c);toast('Ajustes guardados');render();}catch(x){console.warn(x);toast('No se pudo guardar');}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});
window.addEventListener('hashchange',render);
setInterval(()=>{if(tab()==='hoy'&&!document.getElementById('sheetRoot').firstChild)render();},20000);

render();
init();
})();
</script>

</body>
</html>
